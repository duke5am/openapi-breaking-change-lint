# Purely additive counterpart of additive-old.yaml: nothing existing changed,
# values were only added. The diff must report zero breaking changes (and zero
# potentially breaking changes).
openapi: 3.0.3
info:
  title: Additive Control API
  version: 1.1.0
  description: >-
    Negative control: the counterpart file only adds things, so the diff must
    report zero breaking changes.
paths:
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns one page of widgets.
      parameters:
        - name: limit
          in: query
          description: Maximum number of widgets to return.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: page-token
          in: query
          description: Opaque cursor returned by the previous page.
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          description: Alternative cursor form, added in 1.1.0.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of widgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetPage'
            application/xml:
              schema:
                $ref: '#/components/schemas/WidgetPage'
        '400':
          description: A query parameter was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createWidget
      summary: Create a widget
      description: Creates a widget and returns the stored representation.
      requestBody:
        description: The widget to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWidget'
      responses:
        '201':
          description: The widget was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '400':
          description: The request body was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /widgets/{widgetId}:
    parameters:
      - name: widgetId
        in: path
        description: Identifier of the widget.
        required: true
        schema:
          type: string
    get:
      operationId: getWidget
      summary: Get a widget
      description: Returns a single widget by identifier.
      responses:
        '200':
          description: The requested widget.
          headers:
            X-Total-Count:
              description: Total number of widgets in the collection.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '404':
          description: No widget has that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /widgets/{widgetId}/parts:
    parameters:
      - name: widgetId
        in: path
        description: Identifier of the widget.
        required: true
        schema:
          type: string
    get:
      operationId: listWidgetParts
      summary: List a widget's parts
      description: Returns one page of the parts belonging to a widget.
      parameters:
        - name: limit
          in: query
          description: Maximum number of parts to return.
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: page-token
          in: query
          description: Opaque cursor returned by the previous page.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartPage'
        '404':
          description: No widget has that identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Widget:
      type: object
      description: A widget.
      required:
        - id
        - name
        - created-at
      properties:
        id:
          type: string
          description: Server-assigned identifier.
        name:
          type: string
          description: Display name of the widget.
        color:
          type: string
          description: Dominant colour of the widget.
        created-at:
          type: string
          format: date-time
          description: When the widget was created.
        status:
          type: string
          description: Lifecycle status.
          enum:
            - active
            - retired
            - archived
      additionalProperties: false
    WidgetPage:
      type: object
      description: One page of widgets.
      required:
        - items
      properties:
        items:
          type: array
          description: The widgets on this page.
          items:
            $ref: '#/components/schemas/Widget'
        next-page-token:
          type: string
          nullable: true
          description: Cursor for the following page.
      additionalProperties: false
    NewWidget:
      type: object
      description: Payload accepted when creating a widget.
      required:
        - name
      properties:
        name:
          type: string
          description: Display name of the widget.
      additionalProperties: false
    Part:
      type: object
      description: A part belonging to a widget.
      required:
        - id
      properties:
        id:
          type: string
          description: Server-assigned identifier.
      additionalProperties: false
    PartPage:
      type: object
      description: One page of parts.
      required:
        - items
      properties:
        items:
          type: array
          description: The parts on this page.
          items:
            $ref: '#/components/schemas/Part'
        next-page-token:
          type: string
          nullable: true
          description: Cursor for the following page.
      additionalProperties: false
    Error:
      type: object
      description: A machine-readable error.
      properties:
        code:
          type: string
          description: Stable error code.
      additionalProperties: false
