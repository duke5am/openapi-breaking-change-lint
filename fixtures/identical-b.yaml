# Same document as identical-a.yaml: reordered keys, flow style, quoted scalars
# and comments. The diff against identical-a.yaml and identical-c.json must be
# empty.
openapi: "3.0.3"
info: {version: 1.0.0, description: "Negative control: this file and identical-b.yaml / identical-c.json describe exactly the same API in different syntax, so the diff must be empty.", title: Identical Control API}
paths:
  /widgets/{widgetId}:
    get:
      responses:
        '404': {description: No widget has that identifier., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '200': {content: {application/json: {schema: {$ref: '#/components/schemas/Widget'}}}, description: The requested widget.}
      description: Returns a single widget by identifier.
      summary: Get a widget
      operationId: getWidget
    parameters:
      - schema: {type: string}
        required: true
        description: Identifier of the widget.
        in: path
        name: widgetId
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets
      description: Returns one page of widgets.
      parameters:
        - {name: limit, in: query, description: Maximum number of widgets to return., required: false, schema: {type: integer, format: int32, default: 20}}
        - {name: page-token, in: query, description: Opaque cursor returned by the previous page., required: false, schema: {type: string}}
      responses:
        '200':
          description: A page of widgets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WidgetPage'}
        '400':
          description: A query parameter was invalid.
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
components:
  schemas:
    Error:
      additionalProperties: false
      properties: {code: {type: string, description: Stable error code.}}
      description: A machine-readable error.
      type: object
    WidgetPage:
      type: object
      description: One page of widgets.
      required: [items]
      properties:
        items: {type: array, description: The widgets on this page., items: {$ref: '#/components/schemas/Widget'}}
        next-page-token: {type: string, nullable: true, description: Cursor for the following page.}
      additionalProperties: false
    Widget:
      properties:
        status: {enum: [active, retired], type: string, description: Lifecycle status.}
        id: {type: string, description: Server-assigned identifier.}
        name: {type: string, description: Display name of the widget.}
      required: [id, name]
      description: A widget.
      type: object
      additionalProperties: false
